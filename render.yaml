# One-service deployment on Render (https://render.com) — "New > Blueprint",
# point at this repo, set the secret env vars when prompted.
#
# The Flask app serves the built React frontend itself (see backend/app/__init__.py),
# so a single free web service hosts the entire product.

services:
  - type: web
    name: dependency-detective
    runtime: python
    plan: free
    buildCommand: >-
      pip install -r backend/requirements.txt
      && npm --prefix frontend ci
      && npm --prefix frontend run build
    startCommand: cd backend && gunicorn run:app --bind 0.0.0.0:$PORT --workers 2
    envVars:
      - key: GRAPH_BACKEND
        value: cognodb
      - key: COGNODB_URI
        sync: false        # paste your instance's Bolt URI in the dashboard
      - key: COGNODB_USERNAME
        value: cognodb
      - key: COGNODB_PASSWORD
        sync: false        # paste your instance password in the dashboard
